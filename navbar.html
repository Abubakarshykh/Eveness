<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script> <!-- Include Tailwind CSS -->
</head>
<body>
    <script src="script.js"></script>
    <nav class="sticky top-0 left-0 w-full py-4 px-8 flex justify-between items-center text-gray-800 z-50">
        <!-- Logo on Left -->
        <div class="text-2xl font-normal flex items-center px-4 py-2 font-gopher rounded-lg flex gap-2 items-center" style="background-color: rgba(255, 255, 255, 0.6);">
            <img src="images/logo.png" alt="Logo" class="h-6 w-6"> EVENESS
        </div>

        <!-- Right-side content (Menu + Button) -->
        <div class="flex items-center space-x-2">
            <!-- Desktop Menu -->
            <ul class="hidden font-poppins lg:flex space-x-6 bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md" style="background-color: rgba(255, 255, 255, 0.6);">
                <li class="hover:text-gray-600 cursor-pointer font-semibold">Home</li>
                <li class="hover:text-gray-600 cursor-pointer">Dashboard</li>
                <li class="hover:text-gray-600 cursor-pointer">Shop</li>
                <li class="hover:text-gray-600 cursor-pointer">Magazine</li>
                <li class="hover:text-gray-600 cursor-pointer">Account</li>
                <li class="hover:text-gray-600 cursor-pointer">Cart</li>
            </ul>

            <!-- Menu Button (Visible on All Screens) -->
            <button id="menu-btn" class="text-gray-800 text-xl px-3 py-2 rounded-xl" style="background-color: rgba(255, 255, 255, 0.6);">
                &#9776;
            </button>
        </div>

        <!-- Mobile Menu (Hidden by Default) -->
        <div id="mobile-menu" class="hidden absolute top-16 right-4 bg-white/20 backdrop-blur-md rounded-lg shadow-md w-48 z-50">
            <ul class="flex flex-col p-4 space-y-2 text-gray-800">
                <li class="hover:text-gray-600 cursor-pointer font-semibold">Home</li>
                <li class="hover:text-gray-600 cursor-pointer">Dashboard</li>
                <li class="hover:text-gray-600 cursor-pointer">Shop</li>
                <li class="hover:text-gray-600 cursor-pointer">Magazine</li>
                <li class="hover:text-gray-600 cursor-pointer">Account</li>
                <li class="hover:text-gray-600 cursor-pointer">Cart</li>
            </ul>
        </div>
    </nav>

    <script defer>
        document.addEventListener("DOMContentLoaded", function() {
    const mobileMenuButton = document.getElementById('menu-btn'); // Corrected ID
    const mobileMenu = document.getElementById('mobile-menu');

    mobileMenuButton.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden'); // Toggle the menu visibility
    });
});
    </script>
</body>
</html>
